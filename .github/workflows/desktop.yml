name: Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Linux smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux dir --publish never
      - run: xvfb-run -a npm run test:desktop
        env:
          ALVA_EXECUTABLE: ${{ github.workspace }}/release/linux-unpacked/alva

  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tag the version (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" && git push origin "$tag"
          fi
      # On main, a new version in package.json becomes a GitHub release (tag v<version>) with the
      # installer and latest.yml, which the installed apps read to update themselves. A version
      # that is already released is left alone.
      - name: Build (and publish on main)
        shell: bash
        run: npx electron-builder --win nsis --publish ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Alva-Windows
          path: release/*.exe
