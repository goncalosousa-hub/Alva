name: Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Linux smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux dir --publish never
      - run: xvfb-run -a npm run test:desktop
        env:
          ALVA_EXECUTABLE: ${{ github.workspace }}/release/linux-unpacked/alva

  windows:
    name: Windows installer
    runs-on: windows-latest
    # One publication at a time.
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis --publish never
      # An update from inside Alva runs the new installer with --updated, not silent, so its progress
      # shows: it must finish without asking anything and open Alva again (build/installer.nsh).
      - name: Update installs without questions and reopens Alva
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $setup = Resolve-Path "release/Alva-Setup-$version.exe"
          Start-Process $setup -ArgumentList "/S" -Wait
          $installer = Start-Process $setup -ArgumentList "--updated", "--force-run" -PassThru
          if (-not $installer.WaitForExit(180000)) {
            Stop-Process -Id $installer.Id -Force
            throw "The update installer is waiting for input"
          }
          if ($installer.ExitCode -ne 0) { throw "The update installer failed ($($installer.ExitCode))" }
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Get-Process Alva -ErrorAction SilentlyContinue)) {
            if ((Get-Date) -gt $deadline) { throw "Alva did not open after the update" }
            Start-Sleep -Seconds 2
          }
          Write-Host "Alva reopened after the update"
          Stop-Process -Name Alva -Force
      # On main, a new version in package.json becomes a GitHub release (tag v<version>) with the
      # installer, its blockmap and latest.yml, which installed apps read to update themselves.
      # A complete release of the version is left alone; incomplete ones are replaced.
      - name: Publish the release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          # Releases of this version without latest.yml (failed or duplicate publications) go away:
          # with two releases on one tag, apps could download from the incomplete one.
          for id in $(jq --arg t "$tag" '.[] | select(.tag_name == $t and (any(.assets[]; .name == "latest.yml") | not)) | .id' <<< "$releases"); do
            echo "Removing incomplete release $id of $tag"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          complete="$(jq --arg t "$tag" '[.[] | select(.tag_name == $t and any(.assets[]; .name == "latest.yml"))] | length' <<< "$releases")"
          if [ "$complete" != "0" ]; then
            echo "$tag is already released"
            exit 0
          fi
          gh release create "$tag" \
            "release/Alva-Setup-$version.exe" \
            "release/Alva-Setup-$version.exe.blockmap" \
            release/latest.yml \
            --title "$version" --target "$GITHUB_SHA" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: Alva-Windows
          path: release/*.exe
